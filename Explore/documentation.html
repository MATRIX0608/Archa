// Keep documentation in sync with Explore. Add every extra item without duplicates.
Object.keys(additionalEntries).forEach(state => {
  Object.keys(additionalEntries[state]).forEach(tab => {
    additionalEntries[state][tab].forEach(name => {
      const exists = (data[state] || []).some(x => x[0] === name && x[2] === tab);
      if (!exists) {
        const kind = tab === 'monuments' ? 'historic heritage' : tab === 'festivals' ? 'regional celebration' : tab === 'food' ? 'local cuisine' : tab === 'craft' ? 'traditional art and craft' : 'living cultural storytelling';
        (data[state] || (data[state] = [])).push([name, state, tab, `A documented example of ${kind} associated with ${state}.`]);
      }
    });
  });
});

const icons={monuments:"🏛️",festivals:"🎉",food:"🍛",craft:"🎨",stories:"📖"};
const params=new URLSearchParams(location.search);
const state=params.get("state")||"Rajasthan";
const type=params.get("type")||"monuments";
const item=params.get("item")||"";

// Always open the exact item clicked. There is intentionally NO fallback to another item.
const entry=(data[state]||[]).find(x=>x[0]===item && x[2]===type);

const sectionText={
  monuments:{
    development:`${entry ? entry[0] : item} is part of the built heritage associated with ${state}. Its history can be understood through its architecture, location, historical setting and the communities connected with it.`,
    importance:`${entry ? entry[0] : item} is important because it preserves evidence of the history and cultural development of ${state}. It helps visitors understand the people, traditions and historical periods connected with the place.`,
    represents:`It represents an important part of ${state}'s heritage and shows how architecture, history and community memory come together in a physical place.`
  },
  festivals:{
    development:`${entry ? entry[0] : item} developed through community traditions, shared celebrations and practices passed from one generation to another in ${state}.`,
    importance:`It is important because it brings communities together and keeps cultural practices, music, food, rituals and local customs visible in everyday life.`,
    represents:`It represents the shared identity, values and living traditions of the communities of ${state}.`
  },
  food:{
    development:`${entry ? entry[0] : item} developed from local ingredients, cooking methods and eating practices associated with ${state}. Recipes and preparation styles are commonly passed through families and communities.`,
    importance:`It is important because food preserves everyday cultural knowledge and connects people with local ingredients, occasions, family traditions and regional history.`,
    represents:`It represents the culinary identity of ${state} and the relationship between its people, environment and traditions.`
  },
  craft:{
    development:`${entry ? entry[0] : item} developed through skilled making, locally available materials and knowledge passed between artisans and communities in ${state}.`,
    importance:`It is important because traditional crafts preserve practical skills, artistic knowledge and livelihoods while keeping regional design traditions alive.`,
    represents:`It represents the creativity, craftsmanship and cultural identity of the communities associated with ${state}.`
  },
  stories:{
    development:`${entry ? entry[0] : item} developed through oral storytelling, songs, performances and memories passed between generations in ${state}.`,
    importance:`It is important because stories preserve community memory, values, historical experiences and ways of understanding places and people.`,
    represents:`It represents the living cultural memory of ${state} and the knowledge carried through its storytelling traditions.`
  }
};

const labels={monuments:"MONUMENT",festivals:"FESTIVAL",food:"FOOD",craft:"ART & CRAFT",stories:"STORY"};
const categoryNames={monuments:"Monuments",festivals:"Festivals",food:"Food",craft:"Art & Craft",stories:"Stories"};

document.getElementById("docIcon").textContent=icons[type]||"📚";
document.getElementById("docType").textContent=labels[type]||"DOCUMENTATION";
document.getElementById("docTitle").textContent=entry?entry[0]:"Documentation not found";
document.getElementById("docLocation").textContent=entry?entry[1]:"Please return to Explore and select another item.";
document.getElementById("docAbout").textContent=entry?entry[3]:"This exact item could not be found. Please return to Explore and select it again.";
const details=entry ? sectionText[type] : null;
document.getElementById("docDevelopment").textContent=details?details.development:"The selected documentation item could not be found.";
document.getElementById("docImportance").textContent=details?details.importance:"Please return to Explore and select a valid item.";
document.getElementById("docRepresents").textContent=details?details.represents:"Please return to Explore and select a valid item.";
document.getElementById("docState").textContent=state;
document.getElementById("docCategory").textContent=categoryNames[type]||"Heritage";
document.getElementById("backButton").href=`explore.html?state=${encodeURIComponent(state)}#${type}`;
</script>
