<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<style>
  :root{
    --ink:#5a2a12;
    --muted:#8a5a3a;
    --saffron:#ff8a3d;
    --saffron-deep:#e85d2a;
    --red:#d1372a;
    --red-deep:#a8241c;
    --error:#c0392b;
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:
      linear-gradient(180deg,
        #fdeee0 0%,
        #fde3cf 30%,
        #fcd9bf 55%,
        #fbcda8 75%,
        #f8c39a 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
  }

  /* soft glow behind everything */
  .glow{
    position:absolute;
    top:-10%;
    left:50%;
    transform:translateX(-50%);
    width:900px; height:900px;
    background:radial-gradient(circle, rgba(255,214,168,0.9) 0%, rgba(253,238,224,0) 65%);
    z-index:0;
  }

  /* clouds */
  .cloud{
    position:absolute;
    z-index:1;
    opacity:0.85;
  }
  .cloud svg{ display:block; width:100%; height:100%; }
  .cloud.c1{ width:180px; bottom:6%; left:4%; }
  .cloud.c2{ width:140px; bottom:14%; left:20%; opacity:0.6;}
  .cloud.c3{ width:200px; bottom:4%; right:6%; }
  .cloud.c4{ width:120px; bottom:20%; right:22%; opacity:0.55;}
  .cloud.c5{ width:110px; top:10%; left:8%; opacity:0.5;}

  /* birds */
  .bird{
    position:absolute;
    z-index:2;
    color:#7a4a2a;
    opacity:0.7;
  }
  .bird svg{ width:22px; height:14px; display:block; }
  .bird.b1{ top:22%; left:18%; transform:rotate(-4deg) scale(0.9); }
  .bird.b2{ top:30%; left:26%; transform:rotate(2deg) scale(0.7); }
  .bird.b3{ top:16%; right:30%; transform:rotate(-6deg) scale(1.1); }

  /* flowing ribbon top-right, draping down behind the card */
  .ribbon{
    position:absolute;
    top:-8%;
    right:-6%;
    width:640px;
    max-width:70vw;
    z-index:2;
    filter:drop-shadow(0 20px 30px rgba(120,30,10,0.18));
  }
  .ribbon svg{ width:100%; height:auto; display:block; }

  /* card */
  .stage{
    position:relative;
    z-index:3;
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg,#fffaf3 0%, #fdf1e2 100%);
    border-radius:14px;
    box-shadow:
      0 30px 60px -20px rgba(150,60,20,0.35),
      0 0 0 1px rgba(255,255,255,0.6) inset;
    padding:34px 32px 32px;
  }

  .brand{
    text-align:center;
    margin-bottom:22px;
  }
  .brand-mark{
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--saffron-deep);
    margin-bottom:6px;
  }
  .brand-title{
    font-size:24px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:0.01em;
  }
  .brand-sub{
    font-size:12.5px;
    color:var(--muted);
    margin-top:4px;
  }

  .panel{ display:none; }
  .panel.active{ display:block; animation:rise .35s ease; }
  @keyframes rise{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  h1.formtitle{
    font-size:19px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 4px;
    text-align:center;
  }
  p.formsub{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 22px;
    text-align:center;
    line-height:1.5;
  }

  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:0 0 6px;
  }
  .field{ margin-bottom:16px; }
  .field input{
    width:100%;
    padding:12px 14px;
    border:1px solid #f0d3b4;
    border-radius:8px;
    background:#fffdfa;
    font-size:14px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input::placeholder{ color:#c9a583; }
  .field input:focus{
    border-color:var(--saffron-deep);
    box-shadow:0 0 0 3px rgba(232,93,42,0.12);
  }
  .field.error input{ border-color:var(--error); }
  .field-msg{
    font-size:11.5px;
    color:var(--error);
    min-height:14px;
    margin-top:5px;
  }

  .pw-wrap{ position:relative; }
  .pw-toggle{
    position:absolute;
    right:10px; top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    font-size:11.5px;
    color:var(--saffron-deep);
    cursor:pointer;
    font-family:inherit;
    padding:4px;
  }

  .row-between{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:-4px 0 20px;
    font-size:12.5px;
  }
  .remember{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
  }
  .remember input{ accent-color:var(--saffron-deep); }
  a.link, button.link{
    color:var(--saffron-deep);
    text-decoration:none;
    background:none;
    border:none;
    font-family:inherit;
    font-size:12.5px;
    cursor:pointer;
    padding:0;
    font-weight:600;
  }
  a.link:hover, button.link:hover{ text-decoration:underline; }

  button.primary{
    width:100%;
    padding:13px;
    background:linear-gradient(90deg, var(--saffron) 0%, var(--red) 100%);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:0.03em;
    cursor:pointer;
    transition:filter .15s, transform .15s;
    font-family:inherit;
    box-shadow:0 10px 20px -8px rgba(209,55,42,0.55);
  }
  button.primary:hover{ filter:brightness(1.06); transform:translateY(-1px); }
  button.primary:disabled{ background:#e3b79a; cursor:not-allowed; box-shadow:none; }

  .switch-line{
    margin-top:20px;
    font-size:12.5px;
    color:var(--muted);
    text-align:center;
  }

  .back-row{
    display:flex; align-items:center; gap:8px;
    margin-bottom:18px;
    justify-content:center;
    position:relative;
  }
  .back-row button{
    position:absolute; left:0;
    background:none; border:1px solid #f0d3b4;
    border-radius:6px;
    width:28px; height:28px;
    cursor:pointer; color:var(--ink);
    font-size:14px;
  }

  .toast{
    display:none;
    background:#fdece0;
    border:1px solid #f3c9a3;
    color:var(--red-deep);
    font-size:12.5px;
    padding:9px 12px;
    border-radius:8px;
    margin-bottom:16px;
  }
  .toast.show{ display:block; }

  .strength{
    height:4px;
    background:#f0d3b4;
    margin-top:8px;
    border-radius:2px;
    overflow:hidden;
  }
  .strength-bar{
    height:100%;
    width:0%;
    background:var(--error);
    transition:width .2s, background .2s;
  }
  .strength-label{
    font-size:11px;
    color:var(--muted);
    margin-top:4px;
  }

  @media (max-width:480px){
    .ribbon{ width:420px; top:-6%; right:-20%; }
    .stage{ padding:28px 22px 26px; }
  }
</style>
</head>
<body>

<div class="glow"></div>

<!-- clouds -->
<div class="cloud c5"><svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="60" rx="55" ry="28" fill="#fff3e4"/><ellipse cx="110" cy="50" rx="45" ry="24" fill="#fff3e4"/><ellipse cx="150" cy="65" rx="35" ry="20" fill="#fff3e4"/></svg></div>
<div class="cloud c1"><svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="60" rx="55" ry="28" fill="#ffffff"/><ellipse cx="110" cy="50" rx="45" ry="24" fill="#ffffff"/><ellipse cx="150" cy="65" rx="35" ry="20" fill="#ffffff"/></svg></div>
<div class="cloud c2"><svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="60" rx="55" ry="28" fill="#fff6ea"/><ellipse cx="110" cy="50" rx="45" ry="24" fill="#fff6ea"/><ellipse cx="150" cy="65" rx="35" ry="20" fill="#fff6ea"/></svg></div>
<div class="cloud c3"><svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="60" rx="55" ry="28" fill="#ffffff"/><ellipse cx="110" cy="50" rx="45" ry="24" fill="#ffffff"/><ellipse cx="150" cy="65" rx="35" ry="20" fill="#ffffff"/></svg></div>
<div class="cloud c4"><svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="60" rx="55" ry="28" fill="#fff3e4"/><ellipse cx="110" cy="50" rx="45" ry="24" fill="#fff3e4"/><ellipse cx="150" cy="65" rx="35" ry="20" fill="#fff3e4"/></svg></div>

<!-- birds -->
<div class="bird b1"><svg viewBox="0 0 24 14" xmlns="http://www.w3.org/2000/svg"><path d="M0 8 Q6 0 12 8 Q18 0 24 8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></div>
<div class="bird b2"><svg viewBox="0 0 24 14" xmlns="http://www.w3.org/2000/svg"><path d="M0 8 Q6 0 12 8 Q18 0 24 8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></div>
<div class="bird b3"><svg viewBox="0 0 24 14" xmlns="http://www.w3.org/2000/svg"><path d="M0 8 Q6 0 12 8 Q18 0 24 8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></div>

<!-- flowing ribbon -->
<div class="ribbon">
  <svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="ribGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff9a4d"/>
        <stop offset="45%" stop-color="#e8452c"/>
        <stop offset="100%" stop-color="#a8241c"/>
      </linearGradient>
      <linearGradient id="ribGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffb066"/>
        <stop offset="100%" stop-color="#d1372a"/>
      </linearGradient>
    </defs>
    <path d="M60,0 C180,40 260,10 340,70 C420,130 380,190 460,230 C540,270 560,220 640,260 L640,0 Z" fill="url(#ribGrad2)" opacity="0.9"/>
    <path d="M0,40 C120,90 200,40 300,110 C400,180 360,240 470,270 C560,295 580,240 640,270 L640,340 C520,300 480,340 400,300 C300,250 340,190 250,140 C160,90 100,140 0,110 Z" fill="url(#ribGrad)"/>
  </svg>
</div>

<div class="stage">

  <!-- LOGIN PANEL -->
  <section class="panel active" id="panel-login">
    <h1 class="formtitle">Welcome back</h1>
    <p class="formsub">Sign in to continue your journey.</p>

    <div class="toast" id="login-toast"></div>

    <form id="login-form" novalidate>
      <div class="field" id="login-email-field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="username">
        <div class="field-msg" id="login-email-msg"></div>
      </div>

      <div class="field" id="login-pass-field">
        <label for="login-pass">Password</label>
        <div class="pw-wrap">
          <input type="password" id="login-pass" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="pw-toggle" data-target="login-pass">Show</button>
        </div>
        <div class="field-msg" id="login-pass-msg"></div>
      </div>

      <div class="row-between">
        <label class="remember"><input type="checkbox"> Remember me</label>
        <button type="button" class="link" data-goto="forgot">Forgot password?</button>
      </div>

      <button type="submit" class="primary">Sign in</button>
    </form>

    <div class="switch-line">
      New here? <button type="button" class="link" data-goto="create">Create an account</button>
    </div>
  </section>

  <!-- FORGOT PASSWORD PANEL -->
  <section class="panel" id="panel-forgot">
    <div class="back-row">
      <button type="button" data-goto="login" aria-label="Back to sign in">&larr;</button>
      <h1 class="formtitle" style="margin:0;">Reset password</h1>
    </div>
    <p class="formsub">Enter your email — we'll send a 6-digit code.</p>

    <div class="toast" id="forgot-toast"></div>

    <form id="forgot-request-form" novalidate>
      <div class="field" id="forgot-email-field">
        <label for="forgot-email">Email</label>
        <input type="email" id="forgot-email" placeholder="you@example.com">
        <div class="field-msg" id="forgot-email-msg"></div>
      </div>
      <button type="submit" class="primary">Send reset code</button>
    </form>

    <form id="forgot-otp-form" novalidate style="display:none; margin-top:4px;">
      <div class="field" id="otp-field">
        <label for="otp-code">6-digit code</label>
        <input type="text" id="otp-code" maxlength="6" placeholder="000000" inputmode="numeric">
        <div class="field-msg" id="otp-msg"></div>
      </div>
      <button type="submit" class="primary">Verify code</button>
    </form>
  </section>

  <!-- CREATE NEW PASSWORD PANEL -->
  <section class="panel" id="panel-newpass">
    <div class="back-row">
      <button type="button" data-goto="login" aria-label="Back to sign in">&larr;</button>
      <h1 class="formtitle" style="margin:0;">New password</h1>
    </div>
    <p class="formsub">Choose a strong password you haven't used before.</p>

    <div class="toast" id="newpass-toast"></div>

    <form id="newpass-form" novalidate>
      <div class="field" id="newpass1-field">
        <label for="newpass1">New password</label>
        <div class="pw-wrap">
          <input type="password" id="newpass1" placeholder="At least 8 characters" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="newpass1">Show</button>
        </div>
        <div class="strength"><div class="strength-bar" id="strength-bar"></div></div>
        <div class="strength-label" id="strength-label">Password strength</div>
        <div class="field-msg" id="newpass1-msg"></div>
      </div>

      <div class="field" id="newpass2-field">
        <label for="newpass2">Confirm password</label>
        <div class="pw-wrap">
          <input type="password" id="newpass2" placeholder="Re-enter password" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="newpass2">Show</button>
        </div>
        <div class="field-msg" id="newpass2-msg"></div>
      </div>

      <button type="submit" class="primary">Save password</button>
    </form>
  </section>

  <!-- CREATE ACCOUNT PANEL -->
  <section class="panel" id="panel-create">
    <div class="back-row">
      <button type="button" data-goto="login" aria-label="Back to sign in">&larr;</button>
      <h1 class="formtitle" style="margin:0;">Create account</h1>
    </div>
    <p class="formsub">Set up your account.</p>

    <div class="toast" id="create-toast"></div>

    <form id="create-form" novalidate>
      <div class="field" id="create-name-field">
        <label for="create-name">Full name</label>
        <input type="text" id="create-name" placeholder="Your name">
        <div class="field-msg" id="create-name-msg"></div>
      </div>

      <div class="field" id="create-email-field">
        <label for="create-email">Email</label>
        <input type="email" id="create-email" placeholder="you@example.com">
        <div class="field-msg" id="create-email-msg"></div>
      </div>

      <button type="submit" class="primary">Continue</button>
    </form>

    <div class="switch-line">
      Already have an account? <button type="button" class="link" data-goto="login">Sign in</button>
    </div>
  </section>

</div>

<script>
(function(){
  const panels = ['login','forgot','newpass','create'];
  function goto(name){
    panels.forEach(p=>{
      document.getElementById('panel-'+p).classList.toggle('active', p===name);
    });
    if(name==='forgot'){
      document.getElementById('forgot-request-form').style.display = '';
      document.getElementById('forgot-otp-form').style.display = 'none';
      hideToast('forgot-toast');
    }
  }

  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.addEventListener('click', ()=> goto(el.getAttribute('data-goto')));
  });

  document.querySelectorAll('.pw-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const input = document.getElementById(btn.getAttribute('data-target'));
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Hide' : 'Show';
    });
  });

  function setError(fieldId, msgId, message){
    document.getElementById(fieldId).classList.add('error');
    document.getElementById(msgId).textContent = message;
  }
  function clearError(fieldId, msgId){
    document.getElementById(fieldId).classList.remove('error');
    document.getElementById(msgId).textContent = '';
  }
  function showToast(id, text){
    const el = document.getElementById(id);
    el.textContent = text;
    el.classList.add('show');
  }
  function hideToast(id){
    document.getElementById(id).classList.remove('show');
  }
  function validEmail(v){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  // ---- LOGIN ----
  document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    let ok = true;
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;

    clearError('login-email-field','login-email-msg');
    clearError('login-pass-field','login-pass-msg');
    hideToast('login-toast');

    if(!validEmail(email)){ setError('login-email-field','login-email-msg','Enter a valid email address.'); ok=false; }
    if(pass.length < 1){ setError('login-pass-field','login-pass-msg','Enter your password.'); ok=false; }

    if(ok){
      showToast('login-toast', 'Signed in successfully. Redirecting to dashboard\u2026');
    }
  });

  // ---- FORGOT PASSWORD: request code ----
  document.getElementById('forgot-request-form').addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('forgot-email').value.trim();
    clearError('forgot-email-field','forgot-email-msg');

    if(!validEmail(email)){
      setError('forgot-email-field','forgot-email-msg','Enter a valid email address.');
      return;
    }
    showToast('forgot-toast', 'Code sent to '+email+'. Check your inbox.');
    document.getElementById('forgot-request-form').style.display = 'none';
    document.getElementById('forgot-otp-form').style.display = '';
  });

  // ---- FORGOT PASSWORD: verify OTP ----
  document.getElementById('forgot-otp-form').addEventListener('submit', function(e){
    e.preventDefault();
    const otp = document.getElementById('otp-code').value.trim();
    clearError('otp-field','otp-msg');

    if(!/^\d{6}$/.test(otp)){
      setError('otp-field','otp-msg','Enter the 6-digit code.');
      return;
    }
    goto('newpass');
  });

  // ---- CREATE ACCOUNT (step 1: name + email) ----
  document.getElementById('create-form').addEventListener('submit', function(e){
    e.preventDefault();
    let ok = true;
    const name = document.getElementById('create-name').value.trim();
    const email = document.getElementById('create-email').value.trim();

    clearError('create-name-field','create-name-msg');
    clearError('create-email-field','create-email-msg');

    if(name.length < 2){ setError('create-name-field','create-name-msg','Enter your full name.'); ok=false; }
    if(!validEmail(email)){ setError('create-email-field','create-email-msg','Enter a valid email address.'); ok=false; }

    if(ok){ goto('newpass'); }
  });

  // ---- CREATE / SET NEW PASSWORD ----
  const p1 = document.getElementById('newpass1');
  const bar = document.getElementById('strength-bar');
  const label = document.getElementById('strength-label');

  p1.addEventListener('input', function(){
    const v = p1.value;
    let score = 0;
    if(v.length >= 8) score++;
    if(/[A-Z]/.test(v)) score++;
    if(/[0-9]/.test(v)) score++;
    if(/[^A-Za-z0-9]/.test(v)) score++;

    const pct = (score/4)*100;
    bar.style.width = pct + '%';
    const colors = ['#c0392b','#c0392b','#e8452c','#f2994a','#27ae60'];
    bar.style.background = colors[score];
    const labels = ['Too weak','Weak','Fair','Good','Strong'];
    label.textContent = v.length ? labels[score] : 'Password strength';
  });

  document.getElementById('newpass-form').addEventListener('submit', function(e){
    e.preventDefault();
    let ok = true;
    const v1 = document.getElementById('newpass1').value;
    const v2 = document.getElementById('newpass2').value;

    clearError('newpass1-field','newpass1-msg');
    clearError('newpass2-field','newpass2-msg');
    hideToast('newpass-toast');

    if(v1.length < 8){ setError('newpass1-field','newpass1-msg','Use at least 8 characters.'); ok=false; }
    if(v2 !== v1 || v2.length===0){ setError('newpass2-field','newpass2-msg','Passwords do not match.'); ok=false; }

    if(ok){
      showToast('newpass-toast', 'Password saved. You can now sign in.');
      setTimeout(()=> goto('login'), 1200);
    }
  });

})();
</script>

</body>
</html>
