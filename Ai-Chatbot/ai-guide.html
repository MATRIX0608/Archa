<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Guide </title>
<link rel="stylesheet" href="/Homepage/style.css">
</head>
<body class="guide-theme">
<div id="site-header" data-active="AI Guide"></div>

<section class="guide-shell">
  <div class="container guide-layout">

    <aside class="guide-side card">
      <b>Suggested questions</b>
      <div class="suggest-list" id="suggestList"></div>
      <hr>
      <b>Language</b>
      <select id="langSelect" class="lang-select">
        <option>English</option>
      </select>
    </aside>

    <div class="guide-chat card">
      <div class="guide-header">
        <div>
          <b>AI Guide</b>
          <span>Your cultural companion</span>
        </div>
        <span class="chip" id="langChip">🌐 English</span>
      </div>

      <div class="guide-messages" id="messages">
        <div class="msg bot">
          <p>Namaste! I'm your guide. Ask me about any monument, festival,
          craft or tradition. </p>
        </div>
      </div>

      <div class="quick-chips" id="quickChips"></div>

      <div class="guide-input-row">
        <input type="text" id="chatInput" placeholder="Ask me anything…">
        <button class="btn btn-primary" id="sendBtn">Send</button>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<style>
.guide-shell{background:var(--sand-200);padding:44px 0 60px;min-height:70vh;}
.guide-layout{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start;}
.guide-side{padding:22px;position:sticky;top:96px;}
.guide-side b{font-family:var(--serif);font-size:15.5px;display:block;margin-bottom:12px;}
.guide-side hr{border:none;border-top:1px solid var(--sand-200);margin:18px 0;}
.suggest-list{display:flex;flex-direction:column;gap:8px;}
.suggest-item{
  text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--sand-200);
  background:var(--sand-100);font-size:12.5px;color:var(--text-main);
}
.suggest-item:hover{border-color:var(--terracotta);}
.lang-select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--sand-300);font-size:13px;}

.guide-chat{display:flex;flex-direction:column;height:620px;}
.guide-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--sand-200);}
.guide-header b{font-family:var(--serif);font-size:17px;display:block;}
.guide-header span:not(.chip){font-size:12px;color:var(--text-soft);}

.guide-messages{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;}
.msg{max-width:78%;padding:12px 16px;border-radius:16px;font-size:13.8px;line-height:1.55;}
.msg.bot{background:var(--ink-900);color:var(--sand-100);border-bottom-left-radius:4px;align-self:flex-start;}
.msg.user{background:var(--sand-200);color:var(--text-main);border-bottom-right-radius:4px;align-self:flex-end;}

.quick-chips{display:flex;gap:8px;padding:0 22px 12px;flex-wrap:wrap;}
.quick-chips .chip{cursor:pointer;background:var(--sand-200);}
.quick-chips .chip:hover{background:var(--sand-300);}

.guide-input-row{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--sand-200);}
.guide-input-row input{
  flex:1;padding:12px 16px;border-radius:999px;border:1px solid var(--sand-300);font-size:13.8px;
}
.mic-btn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--sand-300);background:var(--sand-100);font-size:16px;
}
.mic-btn.recording{background:var(--terracotta);border-color:var(--terracotta);}

@media(max-width:900px){
  .guide-layout{grid-template-columns:1fr;}
  .guide-side{position:static;}
  .guide-chat{height:520px;}
}
</style>

<script src="/Homepage/script.js"></script>
<script src="/Ai-Chatbot/ai-guide.js"></script>
<script>
const suggestions = [
  "Tell me about Konark Sun Temple",
  "What is the story behind Diwali?",
  "Who built the Taj Mahal?",
];

const answers = {
  "default":"That's a wonderful topic to explore. Heritageverse holds stories, dates and craftsmanship details on this — try asking about its history, architecture, or cultural significance for more depth.",
  "tell me about konark sun temple":"Konark Sun Temple is a 13th-century CE temple in Odisha, designed as a giant stone chariot with 24 wheels drawn by seven horses — a masterpiece of Kalinga architecture dedicated to Surya, the Sun God.",
  "what is the story behind diwali?":"Diwali, the Festival of Lights, marks Lord Rama's return to Ayodhya after 14 years of exile and his victory over Ravana. Homes are lit with diyas to celebrate the triumph of light over darkness.",
  "who built the taj mahal?":"The Taj Mahal was commissioned in 1632 by Mughal emperor Shah Jahan in memory of his wife Mumtaz Mahal. It took roughly 20 years and thousands of artisans to complete.",
};

function addMessage(text, who){
  const wrap = document.getElementById("messages");
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.innerHTML = `<p style="margin:0;">${text}</p>`;
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
}

function respond(question){
  const key = question.trim().toLowerCase();
  const answer = answers[key] || answers["default"];
  setTimeout(()=> addMessage(answer, "bot"), 450);
}

function handleSend(){
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text) return;
  addMessage(text, "user");
  respond(text);
  input.value = "";
}

document.getElementById("sendBtn").addEventListener("click", handleSend);
document.getElementById("chatInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") handleSend();
});

document.getElementById("suggestList").innerHTML = suggestions.map(q=>
  `<button class="suggest-item">${q}</button>`).join("");
document.querySelectorAll(".suggest-item").forEach(btn=>{
  btn.addEventListener("click", ()=>{ addMessage(btn.textContent,"user"); respond(btn.textContent); });
});


const micBtn = document.getElementById("micBtn");
micBtn.addEventListener("click", ()=>{
  micBtn.classList.toggle("recording");
  if(micBtn.classList.contains("recording")){
    setTimeout(()=>{
      micBtn.classList.remove("recording");
      document.getElementById("chatInput").value = "Tell me about Konark Sun Temple";
    }, 1400);
  }
});

document.getElementById("langSelect").addEventListener("change", e=>{
  document.getElementById("langChip").textContent = "🌐 " + e.target.value;
});
</script>
</body>
</html>
