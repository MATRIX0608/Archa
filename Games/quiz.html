<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritage Challenge — Heritageverse</title>
<link rel="stylesheet" href="/Homepage/style.css">
<style>
/* This page has its own game styling. games.html remains unchanged visually. */
body.game-page{background:#f7f2e9;min-height:100vh;}
.game-wrap{max-width:900px;margin:0 auto;padding:45px 20px 70px;}
.game-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px;}
.game-title{font-family:var(--serif);font-size:32px;color:var(--ink-900);margin:0;}
.progress{font-size:14px;color:var(--text-soft);}
.game-panel{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:32px;}
.category{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--terracotta);font-weight:700;margin-bottom:12px;}
.question{font-family:var(--serif);font-size:27px;line-height:1.3;color:var(--ink-900);margin:0 0 25px;}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.answer{
  border:2px solid #e5ded2;background:#fff;border-radius:12px;padding:16px;
  text-align:left;font-size:15px;cursor:pointer;transition:.18s;
}
.answer:hover{border-color:var(--terracotta);transform:translateY(-1px);}
.answer.correct{border-color:#2e7d5b;background:#edf8f1;}
.answer.wrong{border-color:#b94a48;background:#fff0ef;}
.answer:disabled{cursor:default;transform:none;}
.feedback{min-height:25px;margin-top:18px;font-weight:700;}
.next-btn{margin-top:15px;display:none;}
.score-box{text-align:center;padding:25px 10px;}
.score{font-family:var(--serif);font-size:48px;color:var(--terracotta);}
.small{color:var(--text-soft);font-size:14px;}
@media(max-width:650px){
  .game-wrap{padding:30px 15px 50px;}
  .game-panel{padding:22px;}
  .question{font-size:23px;}
  .answers{grid-template-columns:1fr;}
  .game-title{font-size:26px;}
}
</style>
</head>

<body class="game-page">
<div id="site-header" data-active="Games"></div>

<main class="game-wrap">
  <div class="game-top">
    <h1 class="game-title">🏛️ Heritage Challenge</h1>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <section class="game-panel" id="gamePanel">
    <div class="category" id="category"></div>
    <h2 class="question" id="question"></h2>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-primary next-btn" id="nextBtn">Next Question →</button>
  </section>
</main>

<script src="/Homepage/script.js"></script>
<script>
const questionBank = [
  {
    category:"Monuments",
    q:"In which city is the Taj Mahal located?",
    a:["Agra","Jaipur","Delhi","Lucknow"], correct:0
  },
  {
    category:"Architecture",
    q:"The Konark Sun Temple is in which state?",
    a:["Odisha","Gujarat","Bihar","Kerala"], correct:0
  },
  {
    category:"History",
    q:"Which city is famous for the historic Charminar?",
    a:["Hyderabad","Pune","Patna","Mysuru"], correct:0
  },
  {
    category:"Heritage",
    q:"Hampi is mainly associated with which historic empire?",
    a:["Vijayanagara Empire","Maurya Empire","Gupta Empire","Chola Empire"], correct:0
  },
  {
    category:"Art",
    q:"Madhubani painting is traditionally associated with which state?",
    a:["Bihar","Punjab","Goa","Assam"], correct:0
  },
  {
    category:"Textiles",
    q:"Banarasi silk is traditionally associated with which city?",
    a:["Varanasi","Surat","Kochi","Bhopal"], correct:0
  },
  {
    category:"Dance",
    q:"Kathak is one of India's major classical dance traditions. It developed strongly in which region?",
    a:["North India","Northeast India","South India","Andaman Islands"], correct:0
  },
  {
    category:"Festivals",
    q:"Onam is a major traditional festival associated with which state?",
    a:["Kerala","Rajasthan","Haryana","Sikkim"], correct:0
  },
  {
    category:"Craft",
    q:"Blue pottery is especially associated with which Indian city?",
    a:["Jaipur","Kolkata","Shimla","Nashik"], correct:0
  },
  {
    category:"Architecture",
    q:"The Brihadisvara Temple is located at which place?",
    a:["Thanjavur","Amritsar","Udaipur","Srinagar"], correct:0
  },
  {
    category:"History",
    q:"The Ajanta Caves are especially known for ancient paintings and sculptures. They are in which state?",
    a:["Maharashtra","Tamil Nadu","Uttarakhand","Punjab"], correct:0
  },
  {
    category:"Food Heritage",
    q:"Bengali cuisine is particularly famous for which traditional sweet?",
    a:["Rasgulla","Dhokla","Mysore Pak","Petha"], correct:0
  }
];

// Shuffle both the questions and answer choices so every game is different.
function shuffle(array){
  return array.map(value => ({value, sort:Math.random()}))
    .sort((a,b)=>a.sort-b.sort).map(({value})=>value);
}

const questions = shuffle([...questionBank]).slice(0, 10).map(item => {
  const choices = item.a.map((text, index) => ({text, correct:index === item.correct}));
  const shuffled = shuffle(choices);
  return {...item, choices:shuffled};
});

let current = 0;
let score = 0;
let answered = false;

const categoryEl = document.getElementById("category");
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const feedbackEl = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");
const progressEl = document.getElementById("progress");
const panel = document.getElementById("gamePanel");

function showQuestion(){
  answered = false;
  const item = questions[current];

  progressEl.textContent = `Question ${current + 1} / ${questions.length}`;
  categoryEl.textContent = item.category;
  questionEl.textContent = item.q;
  feedbackEl.textContent = "";
  nextBtn.style.display = "none";
  answersEl.innerHTML = "";

  item.choices.forEach(choice => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = choice.text;
    button.addEventListener("click", () => chooseAnswer(button, choice.correct));
    answersEl.appendChild(button);
  });
}

function chooseAnswer(button, isCorrect){
  if(answered) return;
  answered = true;

  document.querySelectorAll(".answer").forEach(btn => btn.disabled = true);

  if(isCorrect){
    score++;
    button.classList.add("correct");
    feedbackEl.textContent = "✅ Correct! Great job.";
  }else{
    button.classList.add("wrong");
    feedbackEl.textContent = "❌ Not quite. The correct answer is highlighted.";
    document.querySelectorAll(".answer").forEach(btn => {
      const choice = questions[current].choices.find(c => c.text === btn.textContent);
      if(choice && choice.correct) btn.classList.add("correct");
    });
  }

  nextBtn.textContent = current === questions.length - 1 ? "See Result →" : "Next Question →";
  nextBtn.style.display = "inline-block";
}

nextBtn.addEventListener("click", () => {
  current++;
  if(current >= questions.length){
    showResult();
  }else{
    showQuestion();
  }
});

function showResult(){
  progressEl.textContent = "Finished";
  panel.innerHTML = `
    <div class="score-box">
      <div class="category">Heritage Challenge Complete</div>
      <div class="score">${score} / ${questions.length}</div>
      <p class="small">${getMessage()}</p>
      <button class="btn btn-primary" onclick="location.reload()">Play Again ↻</button>
      <button class="btn" onclick="window.location.href='games.html'">Back to Games</button>
    </div>
  `;
}

function getMessage(){
  if(score >= 9) return "Excellent! You really know your Indian heritage.";
  if(score >= 7) return "Great work! Your heritage knowledge is strong.";
  if(score >= 5) return "Good attempt! Play again and beat your score.";
  return "Nice try! Another round will help you learn more.";
}

showQuestion();
</script>
</body>
</html>
