<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monument Puzzle | Heritageverse</title>
<link rel="stylesheet" href="puzzle.css">
</head>
<body>
<main class="puzzle-shell">
  <a class="back-link" href="games.html">← Back to Games</a>

  <header>
    <p class="eyebrow">HERITAGEVERSE</p>
    <h1>Monument Puzzle</h1>
    <p>Rebuild the Indian monument by swapping the tiles into the correct order.</p>
  </header>

  <section class="topbar">
    <div><span>Monument</span><strong id="monument">—</strong></div>
    <div><span>Moves</span><strong id="moves">0</strong></div>
    <div><span>Score</span><strong id="score">1000</strong></div>
  </section>

  <section class="puzzle-wrap">
    <div id="puzzle" class="puzzle" aria-label="4 by 4 monument puzzle"></div>

    <div class="controls">
      <button id="shuffle" type="button">Shuffle</button>
      <button id="newPuzzle" type="button">New Puzzle</button>
    </div>

    <p id="message" class="message"></p>
  </section>

  <section id="result" class="result hidden" aria-live="polite">
    <div class="result-card">
      <div class="trophy">🏆</div>
      <h2>Puzzle Solved!</h2>
      <p id="resultText"></p>
      <button id="again" class="primary" type="button">Play Again</button>
      <a href="games.html" class="secondary">Back to Games</a>
    </div>
  </section>
</main>
<script src="puzzle.js"></script>
</body>
</html>
