<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match | Heritageverse</title>
  <link rel="stylesheet" href="memory.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <a class="back-link" href="games.html">← Back to Games</a>
      <div>
        <p class="eyebrow">HERITAGEVERSE</p>
        <h1>Memory Match</h1>
        <p>Match the heritage symbols and names. Every round is randomized.</p>
      </div>
      <div class="stats">
        <div><span>Moves</span><strong id="moves">0</strong></div>
        <div><span>Pairs</span><strong id="pairs">0/8</strong></div>
        <div><span>Score</span><strong id="score">0</strong></div>
      </div>
    </header>

    <section id="gameArea" class="game-area">
      <div id="memoryGrid" class="memory-grid"></div>
    </section>

    <section id="result" class="result hidden">
      <div class="result-card">
        <div class="result-icon">🏆</div>
        <h2>Round Complete!</h2>
        <p>You found all the heritage pairs.</p>
        <div class="final-score"><span id="finalScore">0</span><small>points</small></div>
        <button id="playAgain" class="primary-btn">Play Again</button>
        <a href="games.html" class="secondary-btn">Back to Games</a>
      </div>
    </section>
  </main>
  <script src="memory.js"></script>
</body>
</html>
